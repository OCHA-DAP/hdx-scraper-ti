notes: |
  This dataset contains Corruption Perceptions Index (CPI) scores and rankings for countries and territories, published by Transparency International. Scores range from 0 (highly corrupt) to 100 (very clean) and reflect perceived levels of public sector corruption based on assessments by experts and business executives.

  For more information, visit the [Corruption Perceptions Index](https://www.transparency.org/en/cpi) on the Transparency International website.
